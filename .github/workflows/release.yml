name: Release

on:
  push:
    branches:
      - stable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

  publish-github-release:
    name: Sync GitHub Releases
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_KEEP_VERSION_COUNT: "2"
      RELEASE_BODY: |
        ## Install

        ```bash
        npx @yakisan/preflight scan
        ```

        Or install the CLI globally:

        ```bash
        npm install -g @yakisan/preflight
        preflight scan
        ```

        ## Release Notes

        - Preflight is distributed via npm only.
        - `scan` is auto-discovery-first and uses `preflight.config.json` only for sparse overrides.
        - Output includes risk, evidence, missing inputs, and reviewer-pack guidance for local workflows and CI.

        ## Requirements

        - Node.js 20 or newer
        - Legacy `curl`, Go shim, and Homebrew install paths are no longer supported

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync release state
        env:
          RELEASE_BODY: ${{ env.RELEASE_BODY }}
        run: npm run release:sync

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check npm publish secret
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is not configured; skipping npm publish."
          fi

      - name: Check out repository
        if: steps.npm-auth.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: steps.npm-auth.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check if version is already published
        if: steps.npm-auth.outputs.enabled == 'true'
        id: npm-version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.npm-auth.outputs.enabled == 'true' && steps.npm-version.outputs.publish == 'true'
        run: npm ci

      - name: Build package
        if: steps.npm-auth.outputs.enabled == 'true' && steps.npm-version.outputs.publish == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.npm-auth.outputs.enabled == 'true' && steps.npm-version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
